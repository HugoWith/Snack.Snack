<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Réservation — L'Affiche</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@800&amp;family=Manrope:wght@500;700;800&amp;display=swap">
<style>
@font-face{font-family:"Nohemi";src:url(../../public/fonts/Nohemi-ExtraBold.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:"Satoshi";src:url(../../public/fonts/Satoshi-Bold.woff2) format("woff2");font-weight:400 700;font-display:swap}
@font-face{font-family:"Satoshi";src:url(../../public/fonts/Satoshi-Black.woff2) format("woff2");font-weight:800 900;font-display:swap}
body{margin:0;background:#0b0c0b}
a{color:#ffbd00}a:hover{color:#e0a600}
.hero{background:radial-gradient(ellipse at 50% 45%, rgba(11,12,11,0) 30%, rgba(11,12,11,0.6) 85%), linear-gradient(180deg, rgba(11,12,11,0.75) 0%, rgba(11,12,11,0) 16%, rgba(11,12,11,0) 58%, #0b0c0b 100%), url(../../public/img/tablier-chaise.jpg) center 40%/cover}
.fond{background:linear-gradient(180deg, #0b0c0b 0%, rgba(11,12,11,0.75) 20%, rgba(11,12,11,0.9) 70%, #0b0c0b 100%), #0b0c0b url(../../public/img/fond-inox.jpg) center top/180% auto no-repeat}
input::placeholder{color:#a39a93;font-weight:500}
</style>
</helmet>
<div style="width: 390px; height: 1780px; position: relative; overflow: hidden; background: #0b0c0b; color: #f2f0ec; font-family: 'Satoshi', 'Manrope', system-ui, sans-serif">

  <header class="hero" style="height: 844px; box-sizing: border-box; padding: 40px 24px 48px; display: flex; flex-direction: column; justify-content: space-between">
    <div style="text-align: center; font-weight: 900; font-size: 13px; text-transform: uppercase; color: #bab7b7">Déjeuner et after-déjeuner</div>
    <div style="display: flex; flex-direction: column; gap: 28px">
      <p style="margin: 0; font-family: 'Nohemi', 'Inter Tight', sans-serif; font-weight: 800; font-size: 26px; line-height: 1; letter-spacing: -0.055em; text-transform: uppercase; color: #ffbd00">Dimanche 22 novembre.<br>12h00. 45€ le couvert.</p>
      <h1 style="margin: 0; align-self: center"><img src="../../public/img/snack-snack-logo-sm.png" alt="Snack Snack" style="width: 150px; height: auto; display: block"></h1>
    </div>
  </header>

  <section class="fond" style="padding: 40px 28px 0; height: 936px; box-sizing: border-box">
    <div style="margin: 0 0 32px; display: flex; flex-direction: column; align-items: center; gap: 10px">
      <div aria-hidden="true" style="display: flex; gap: 4px">
        <sc-for list="{{seats}}" as="s" hint-placeholder-count="20"><i style="display: block; width: 9px; height: 9px; background: {{s.c}}"></i></sc-for>
      </div>
      <p style="margin: 0; font-weight: 900; font-size: 12px; text-transform: uppercase; color: #bab7b7">Encore <span style="color: #ffbd00">07</span> places sur 20</p>
    </div>

    <form style="background: #e9e4da; color: #5e5560; padding: 36px 24px 32px; transform: rotate(-1deg); box-shadow: 0 24px 48px rgba(0,0,0,0.6); display: flex; flex-direction: column; gap: 28px">
      <label style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase">Prénom et nom:</span>
        <input value="Camille Durand" autocomplete="name" style="border: 0; border-bottom: 1.5px solid #5e5560; background: transparent; padding: 6px 0; font-family: 'Nohemi', 'Inter Tight', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.05em; text-transform: uppercase; color: #1d1b22; outline: none">
      </label>
      <label style="display: flex; flex-direction: column; gap: 4px">
        <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase">Email:</span>
        <input type="email" placeholder="camille@exemple.fr" autocomplete="email" style="border: 0; border-bottom: 1.5px solid #5e5560; background: transparent; padding: 8px 0; font-family: 'Satoshi', 'Manrope', sans-serif; font-weight: 700; font-size: 18px; color: #1d1b22; outline: none">
      </label>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase">Covers:</span>
          <div style="display: flex; align-items: center; gap: 14px">
            <button type="button" aria-label="Retirer un couvert" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1d1b22; font-family: 'Nohemi', 'Inter Tight', sans-serif; font-weight: 800; font-size: 24px; cursor: pointer">−</button>
            <span style="font-family: 'Nohemi', 'Inter Tight', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.05em; color: #1d1b22">2</span>
            <button type="button" aria-label="Ajouter un couvert" disabled style="width: 44px; height: 44px; border: 0; background: transparent; color: #a39a93; font-family: 'Nohemi', 'Inter Tight', sans-serif; font-weight: 800; font-size: 24px">+</button>
          </div>
        </div>
        <div style="display: flex; flex-direction: column; gap: 6px">
          <span style="font-size: 11px; font-weight: 700; letter-spacing: 0.06em; text-transform: uppercase">Dont VG:</span>
          <div style="display: flex; align-items: center; gap: 14px">
            <button type="button" aria-label="Retirer un couvert VG" style="width: 44px; height: 44px; border: 0; background: transparent; color: #1d1b22; font-family: 'Nohemi', 'Inter Tight', sans-serif; font-weight: 800; font-size: 24px; cursor: pointer">−</button>
            <span style="font-family: 'Nohemi', 'Inter Tight', sans-serif; font-weight: 800; font-size: 30px; letter-spacing: -0.05em; color: #1d1b22">1</span>
            <button type="button" aria-label="Ajouter un couvert VG" disabled style="width: 44px; height: 44px; border: 0; background: transparent; color: #a39a93; font-family: 'Nohemi', 'Inter Tight', sans-serif; font-weight: 800; font-size: 24px">+</button>
          </div>
        </div>
      </div>
    </form>
  </section>

  <section style="position: absolute; left: 0; right: 0; bottom: 0; background: #ffbd00; color: #000000; padding: 32px 24px 36px; display: flex; flex-direction: column; gap: 24px">
    <div style="display: flex; justify-content: space-between; align-items: baseline">
      <span style="font-family: 'Nohemi', 'Inter Tight', sans-serif; font-weight: 800; font-size: 26px; letter-spacing: -0.055em; text-transform: uppercase">L'addition.</span>
      <span style="font-family: 'Nohemi', 'Inter Tight', sans-serif; font-weight: 800; font-size: 48px; line-height: 0.85; letter-spacing: -0.06em">90€</span>
    </div>
    <label style="display: flex; gap: 12px; align-items: flex-start; cursor: pointer">
      <input type="checkbox" checked style="width: 20px; height: 20px; margin: 0; flex: none; accent-color: #000000">
      <span style="font-size: 14px; line-height: 1.4; font-weight: 500">C'est noté : pas de remboursement, billet cessible.</span>
    </label>
    <button type="submit" style="border: 0; background: #000000; color: #ffbd00; min-height: 60px; font-family: 'Nohemi', 'Inter Tight', sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.05em; text-transform: uppercase; cursor: pointer">Payer</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1780}}'>
class Component extends DCLogic {
  renderVals() {
    var seats = [];
    for (var i = 0; i < 20; i++) seats.push({ c: i < 13 ? '#3b3c3f' : '#ffbd00' });
    return { seats: seats };
  }
}
</script>
</body>
</html>
